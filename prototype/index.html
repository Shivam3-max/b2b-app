<style>
/* Layout: a real phone screen beside a short reviewer's panel. The phone fills the screen on an actual phone.
   Single light look on purpose: this mirrors the app, which ships light for shops in bright daylight. */
:root {
  --ink: #17140f;
  --ink-2: #5c564c;
  --ink-3: #8a8377;
  --line: #e7e2d9;
  --wash: #f5f2ec;
  --paper: #ffffff;
  --orange: #f26a1b;
  --orange-deep: #b84a0b;
  --orange-soft: #fdeee3;
  --sun: #fdc656;
  --profit: #0f7a45;
  --profit-soft: #e6f4ec;
  --danger: #a3271b;
  --sans: "Instrument Sans", "Noto Sans Devanagari", system-ui, -apple-system, sans-serif;
  --serif: "Instrument Serif", Georgia, serif;
  --gl: max(16px, env(safe-area-inset-left, 0px));
  --gr: max(16px, env(safe-area-inset-right, 0px));
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--wash); color: var(--ink); font: 400 15px/1.4 var(--sans); overflow: hidden; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 2px solid var(--orange-deep); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

.stage { height: 100%; display: flex; justify-content: center; align-items: center; gap: 44px; padding-block: 14px; padding-left: var(--gl); padding-right: var(--gr); }
.phone { position: relative; flex: none; width: 390px; height: min(800px, 100%); background: var(--paper); border: 8px solid var(--ink); border-radius: 38px; overflow: hidden; display: flex; flex-direction: column; }
.notes { width: 370px; min-width: 0; max-height: 100%; overflow-y: auto; }
.notes h1 { font: 400 34px/1.08 var(--serif); margin: 0 0 8px; text-wrap: balance; }
.notes .lead { color: var(--ink-2); margin: 0 0 18px; }
.notes h2 { font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); margin: 18px 0 8px; font-weight: 600; }
.notes ul { margin: 0; padding-left: 18px; display: grid; gap: 5px; color: var(--ink-2); font-size: 14px; }
.tryrow { display: flex; flex-wrap: wrap; gap: 6px; }
.tryrow button { padding: 7px 11px; border: 1px solid var(--line); background: var(--paper); border-radius: 99px; font-size: 13px; font-weight: 500; }
.tryrow button:hover { border-color: var(--ink); }

.top { display: flex; align-items: center; gap: 10px; padding: 12px var(--gr) 10px var(--gl); border-bottom: 1px solid var(--line); min-height: 58px; flex: none; }
.top img { width: 36px; height: 36px; display: block; }
.top h2 { font-size: 17px; font-weight: 700; margin: 0; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.iconbtn { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 50%; background: var(--wash); flex: none; font-weight: 700; }
.chip-proto { display: none; font-size: 11px; font-weight: 600; padding: 5px 9px; border-radius: 99px; background: var(--sun); }

.view { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 14px var(--gr) 18px var(--gl); display: flex; flex-direction: column; gap: 18px; }
.foot { flex: none; border-top: 1px solid var(--line); padding: 10px var(--gr) 10px var(--gl); display: flex; align-items: center; gap: 12px; background: var(--paper); }
.foot .sum { flex: 1; min-width: 0; font-size: 13px; color: var(--ink-2); }
.foot .sum b { display: block; font-size: 18px; color: var(--ink); }

.tabs { flex: none; display: grid; grid-template-columns: repeat(5, 1fr); border-top: 1px solid var(--line); padding: 6px var(--gr) calc(6px + env(safe-area-inset-bottom, 0px)) var(--gl); background: var(--paper); }
.tab { position: relative; display: grid; justify-items: center; gap: 2px; padding: 5px 0; font-size: 11px; font-weight: 500; color: var(--ink-3); }
.tab svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tab.on { color: var(--ink); font-weight: 700; }
.tab .badge { position: absolute; top: 0; left: 50%; margin-left: 5px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px; background: var(--orange); color: var(--ink); font-size: 11px; font-weight: 700; line-height: 18px; text-align: center; }

.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 18px; border-radius: 12px; font-weight: 700; background: var(--ink); color: #fff; white-space: nowrap; }
.btn.line { background: var(--paper); color: var(--ink); border: 1.5px solid var(--ink); }
.btn.orange { background: var(--orange); color: var(--ink); }
.btn.small { min-height: 40px; padding: 0 12px; font-size: 14px; border-radius: 10px; }
.btn.full { width: 100%; }
.btn[disabled] { opacity: .4; cursor: default; }

.offer { background: var(--sun); margin: -14px calc(var(--gr) * -1) 0 calc(var(--gl) * -1); padding: 8px var(--gr) 8px var(--gl); font-size: 13px; font-weight: 600; text-align: center; }
.hello { font: 400 29px/1.1 var(--serif); margin: 0; }
.sec { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.sec h3 { margin: 0; font-size: 17px; font-weight: 700; }
.sec button { font-size: 13px; font-weight: 600; color: var(--orange-deep); }
.block { display: flex; flex-direction: column; gap: 10px; }

.reorder { background: var(--ink); color: #fff; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.reorder .k { font-size: 12px; color: #cfc8ba; }
.reorder .v { font-size: 17px; font-weight: 700; }
.thumbs { display: flex; gap: 6px; }
.thumbs img { width: 46px; height: 58px; object-fit: cover; border-radius: 7px; display: block; }

.cats { display: flex; gap: 8px; overflow-x: auto; margin-inline: calc(var(--gl) * -1) calc(var(--gr) * -1); padding-inline: var(--gl) var(--gr); scrollbar-width: none; }
.cats::-webkit-scrollbar { display: none; }
.cat { flex: none; min-height: 38px; padding: 0 14px; border-radius: 99px; border: 1px solid var(--line); background: var(--paper); font-size: 14px; font-weight: 500; }
.cat.on { background: var(--ink); color: #fff; border-color: var(--ink); }

.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 10px; }
.card { min-width: 0; display: flex; flex-direction: column; gap: 6px; text-align: left; }
.card .ph { display: block; width: 100%; aspect-ratio: 4 / 5; border-radius: 12px; overflow: hidden; background: var(--wash); }
.card .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card .id { font-weight: 700; font-size: 15px; }
.card .meta { font-size: 12px; color: var(--ink-2); }
.card .pr { font-weight: 700; }
.card .pr small { font-weight: 500; color: var(--ink-3); font-size: 11px; }
.profit { font-size: 12px; font-weight: 600; color: var(--profit); }

.hero { display: block; width: calc(100% + var(--gl) + var(--gr)); max-width: none; margin: -14px calc(var(--gr) * -1) 0 calc(var(--gl) * -1); aspect-ratio: 1 / 1; object-fit: cover; object-position: top; background: var(--wash); }
.title { font-size: 21px; font-weight: 700; margin: 0 0 2px; line-height: 1.2; }
.facts { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.facts > div { padding: 9px 12px; min-width: 0; }
.facts > div:nth-child(odd) { border-right: 1px solid var(--line); }
.facts > div:nth-child(n+3) { border-top: 1px solid var(--line); }
.facts .k { font-size: 11px; color: var(--ink-3); }
.facts .v { font-weight: 600; font-size: 14px; }

.sz { display: grid; grid-template-columns: 1fr auto; gap: 8px 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.sz .nm { font-weight: 600; }
.sz .pp { font-size: 12px; color: var(--ink-2); }
.step { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.step button { width: 42px; height: 42px; font-size: 20px; font-weight: 600; }
.step span { width: 36px; text-align: center; font-weight: 700; }

.search { display: flex; flex-direction: column; gap: 6px; }
.field { width: 100%; min-height: 48px; padding: 0 14px; border: 1.5px solid var(--ink); border-radius: 12px; background: var(--paper); }
.hint { font-size: 13px; color: var(--ink-2); margin: 0; }
.sug { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.sug:empty { display: none; }
.sug button { display: flex; align-items: center; gap: 10px; padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--line); }
.sug button:last-child { border-bottom: 0; }
.sug img { width: 34px; height: 42px; object-fit: cover; border-radius: 5px; }

.row { border: 1px solid var(--line); border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
.rowhead { display: flex; align-items: center; gap: 10px; }
.rowhead img { width: 44px; height: 54px; object-fit: cover; border-radius: 7px; flex: none; }
.rowhead .tx { flex: 1; min-width: 0; }
.rowhead .tx b { display: block; }
.rowhead .tx span { font-size: 12px; color: var(--ink-2); }
.x { width: 34px; height: 34px; border-radius: 50%; background: var(--wash); font-weight: 700; flex: none; }
.cells { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 5px; }
.cells label { display: grid; gap: 2px; font-size: 11px; text-align: center; color: var(--ink-2); min-width: 0; }
.cells input { width: 100%; height: 42px; text-align: center; font-weight: 700; border: 1px solid var(--line); border-radius: 8px; background: var(--wash); padding: 0; }
.cells input:focus { background: var(--paper); border-color: var(--ink); outline: none; }

.line { display: flex; gap: 10px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.line img { width: 58px; height: 72px; object-fit: cover; border-radius: 8px; flex: none; }
.line .tx { flex: 1; min-width: 0; }
.line .tx b { display: block; }
.line .tx span { font-size: 13px; color: var(--ink-2); display: block; }
.line .val { font-weight: 700; text-align: right; }
.bill { display: grid; gap: 7px; }
.bill div { display: flex; justify-content: space-between; gap: 12px; }
.bill .t { font-weight: 700; font-size: 18px; padding-top: 8px; border-top: 1px solid var(--line); }
.bill .g { color: var(--profit); font-weight: 600; }
.profitbox { background: var(--profit-soft); border-radius: 14px; padding: 12px; display: grid; gap: 4px; }
.profitbox .big { font-size: 22px; font-weight: 700; color: var(--profit); }
.profitbox span { font-size: 13px; color: var(--ink-2); }

.order { border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.order .h { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.pill { font-size: 12px; font-weight: 700; padding: 4px 9px; border-radius: 99px; background: var(--orange-soft); color: var(--orange-deep); }
.pill.ok { background: var(--profit-soft); color: var(--profit); }
.track { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.track div { font-size: 11px; color: var(--ink-3); padding-top: 7px; border-top: 3px solid var(--line); }
.track div.on { color: var(--ink); font-weight: 600; border-top-color: var(--orange); }

.set { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--line); width: 100%; text-align: left; font-weight: 500; }
.set small { display: block; font-weight: 400; color: var(--ink-2); font-size: 13px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; flex: none; }
.seg button { padding: 7px 11px; font-size: 13px; font-weight: 600; }
.seg button.on { background: var(--ink); color: #fff; }
input[type=range] { width: 100%; accent-color: var(--orange); height: 28px; }
.danger { color: var(--danger); }
.empty { text-align: center; padding: 50px 14px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.empty h3 { margin: 0; font: 400 27px/1.1 var(--serif); }
.empty p { margin: 0; color: var(--ink-2); }

.login { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 14px; padding: 20px var(--gr) 24px var(--gl); overflow-y: auto; }
.login img { width: 118px; height: 118px; align-self: center; }
.login h2 { font: 400 32px/1.08 var(--serif); margin: 0; text-align: center; text-wrap: balance; }
.login p { margin: 0; text-align: center; color: var(--ink-2); }
.otp { letter-spacing: .5em; text-align: center; font-weight: 700; font-size: 20px; }

.scrim { position: absolute; inset: 0; background: rgba(23, 20, 15, .45); display: flex; align-items: flex-end; z-index: 5; }
.sheet { background: var(--paper); width: 100%; max-height: 88%; overflow-y: auto; border-radius: 20px 20px 0 0; padding: 18px var(--gr) calc(18px + env(safe-area-inset-bottom, 0px)) var(--gl); display: flex; flex-direction: column; gap: 12px; }
.sheet h3 { margin: 0; font-size: 19px; font-weight: 700; }
.sheet textarea { width: 100%; min-height: 118px; padding: 10px 12px; border: 1.5px solid var(--ink); border-radius: 12px; resize: vertical; }
.parsed { display: grid; gap: 4px; font-size: 13px; }
.parsed .bad { color: var(--danger); font-weight: 600; }
.parsed .good { color: var(--profit); font-weight: 600; }
.acts { display: flex; gap: 8px; }
.acts .btn { flex: 1; }
.sheet .notes { width: auto; max-height: none; overflow: visible; }
.toast { position: absolute; left: 14px; right: 14px; bottom: 76px; padding: 10px 14px; border-radius: 11px; background: var(--ink); color: #fff; font-size: 14px; font-weight: 500; text-align: center; z-index: 6; }

@media (max-width: 860px) {
  .stage { padding: 0; gap: 0; }
  .notes { display: none; }
  .sheet .notes { display: block; }
  .phone { width: 100%; height: 100%; border: 0; border-radius: 0; }
  .chip-proto { display: block; }
}
</style>

<div class="stage">
  <div class="phone" id="app" aria-label="B2B Store app prototype"></div>
  <aside class="notes" id="notes"></aside>
</div>

function addPacks(id, n) {
  const s = byId(id);
  const cur = state.cart[id] || blank(s);
  state.cart[id] = cur.map(v => v + n);
}
function addQty(id, arr) {
  const s = byId(id);
  const cur = state.cart[id] || blank(s);
  state.cart[id] = cur.map((v, i) => v + (arr[i] || 0));
}
function lineTotals(id, q) {
  const s = byId(id);
  return q.reduce((a, v, i) => ({ pcs: a.pcs + v, val: a.val + v * unit(s, i) }), { pcs: 0, val: 0 });
}
function cartTotals() {
  return Object.entries(state.cart).reduce((a, [id, q]) => {
    const l = lineTotals(id, q);
    return { pcs: a.pcs + l.pcs, val: a.val + l.val };
  }, { pcs: 0, val: 0 });
}
function bill(val) {
  const adv = Math.round(val * 0.02);
  const pay = val - adv;
  const sale = Math.round(val * (1 + state.markup / 100));
  return { adv, pay, sale, earn: sale - pay };
}
const sellOf = p => Math.round(p * (1 + state.markup / 100));

/* Reads a pasted list such as "710 wine 2 pack" or "YB - 2508 x3". The first number after the code is the pack count. */
function parseList(text) {
  return text.split(/\n+/).map(l => l.trim()).filter(Boolean).map(line => {
    const m = line.match(/^(?:yb\s*-?\s*)?(\d{3,4})\b(.*)$/i);
    const st = m && styles.find(s => s.code === m[1]);
    if (!st) return { line, ok: false };
    const c = m[2].match(/\d+/);
    return { line, ok: true, st, packs: c ? Math.max(1, +c[0]) : 1 };
  });
}

function render() {
  const key = state.route + (state.styleId || '');
  const prev = app.querySelector('.scroll');
  const y = prev && state.lastKey === key ? prev.scrollTop : 0;
  const noTabs = ['login', 'done'].includes(state.route);
  const badge = cartTotals().pcs;
  app.innerHTML = VIEWS[state.route]() + (noTabs ? '' : `<nav class="tabs" aria-label="Main">${['home','cat','pad','cart','orders'].map(k => {
    const on = state.route === k || (k === 'cat' && state.route === 'style');
    return `<button class="tab ${on ? 'on' : ''}" data-act="go" data-to="${k}" ${on ? 'aria-current="page"' : ''}>
      <svg viewBox="0 0 24 24" aria-hidden="true">${ICON[k]}</svg>${t(k)}${k === 'cart' && badge ? `<span class="badge num">${badge}</span>` : ''}</button>`;
  }).join('')}</nav>`) + sheetHTML() + (state.toast ? `<div class="toast" role="status">${esc(state.toast)}</div>` : '');
  const next = app.querySelector('.scroll');
  if (next) next.scrollTop = y;
  state.lastKey = key;
}
let toastTimer;
function toast(m) {
  state.toast = m; render();
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { state.toast = ''; render(); }, 2200);
}
function go(r) { state.route = r; state.sheet = null; render(); }
function reorder(items) { items.forEach(([id, n]) => addPacks(id, n)); go('cart'); }

function act(el) {
  const a = el.dataset.act, d = el.dataset;
  if (a === 'go') return go(d.to);
  if (a === 'style') { state.styleId = d.id; return go('style'); }
  if (a === 'filter') { state.filter = d.f; return render(); }
  if (a === 'addpack') { addPacks(d.id, 1); return toast(`${byId(d.id).code} ${byId(d.id).colour}: ${t('pack')} +1`); }
  if (a === 'qty') {
    const s = byId(d.id), q = state.cart[d.id] || blank(s);
    q[+d.i] = Math.max(0, q[+d.i] + +d.d); state.cart[d.id] = q; return render();
  }
  if (a === 'reorderlast') return reorder(SAMPLE_LAST);
  if (a === 'reorderorder') return reorder(state.orders[+d.i].items);
  if (a === 'rmrow') { state.pad.splice(+d.i, 1); return render(); }
  if (a === 'addcode') { addRow(d.id); return; }
  if (a === 'padadd') { state.pad.forEach(r => addQty(r.id, r.q)); state.pad = []; return go('cart'); }
  if (a === 'paste') { state.sheet = 'paste'; state.parsed = null; return render(); }
  if (a === 'pasteread') { state.pasteText = document.getElementById('pasteBox').value; state.parsed = parseList(state.pasteText); return render(); }
  if (a === 'pasteuse') {
    state.parsed.filter(x => x.ok).forEach(x => {
      const row = state.pad.find(r => r.id === x.st.id);
      if (row) row.q = row.q.map(v => v + x.packs);
      else state.pad.push({ id: x.st.id, q: packOf(x.st, x.packs) });
    });
    state.sheet = null; state.parsed = null; return render();
  }
  if (a === 'checkout') { state.sheet = 'checkout'; return render(); }
  if (a === 'place') {
    const items = Object.entries(state.cart).filter(([id, q]) => lineTotals(id, q).pcs > 0)
      .map(([id, q]) => [id, Math.max(1, Math.round(lineTotals(id, q).pcs / sizes(byId(id)).length))]);
    state.orders.unshift({ no:'New sample order', date:'Today', items, stage:0 });
    state.cart = {}; return go('done');
  }
  if (a === 'closesheet') { state.sheet = null; state.parsed = null; return render(); }
  if (a === 'delete') { state.sheet = 'delete'; return render(); }
  if (a === 'about') { state.sheet = 'about'; return render(); }
  if (a === 'lang') { state.lang = d.l; return render(); }
  if (a === 'toast') return toast(d.m);
  if (a === 'signout') { state.step = 'phone'; return go('login'); }
  if (a === 'otp') { state.step = 'otp'; return render(); }
  if (a === 'verify') return go('home');
  if (a === 'demo') {
    state.sheet = null;
    if (d.d === 'reorder') return reorder(SAMPLE_LAST);
    if (d.d === 'paste') { state.route = 'pad'; state.sheet = 'paste'; state.parsed = null; return render(); }
    if (d.d === 'style') { state.styleId = 's10'; return go('style'); }
    if (d.d === 'markup') return go('account');
    if (d.d === 'hindi') { state.lang = state.lang === 'hi' ? 'en' : 'hi'; return render(); }
    if (d.d === 'login') { state.step = 'phone'; return go('login'); }
  }
}
function addRow(id) {
  if (!state.pad.find(r => r.id === id)) state.pad.unshift({ id, q: blank(byId(id)) });
  render();
  const first = document.getElementById(`pad-${id}-0`);
  if (first) first.focus();
}
function refreshPadFoot() {
  const sum = padSum();
  document.getElementById('padSum').innerHTML = `<b>${rs(sum.val)}</b>${sum.pcs} ${t('pieces')}`;
  document.getElementById('padAdd').disabled = !sum.pcs;
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (el && !el.disabled) { act(el); return; }
  if (e.target.classList && e.target.classList.contains('scrim')) { state.sheet = null; state.parsed = null; render(); }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset && el.dataset.pad !== undefined) {
    el.value = el.value.replace(/\D/g, '').slice(0, 3);
    state.pad[+el.dataset.pad].q[+el.dataset.i] = +el.value || 0;
    return refreshPadFoot();
  }
  if (el.id === 'padCode') {
    const v = el.value.replace(/\D/g, '');
    document.getElementById('padSug').innerHTML = !v ? '' : styles.filter(s => s.code.startsWith(v)).slice(0, 4).map(s =>
      `<button data-act="addcode" data-id="${s.id}"><img src="${s.img}" alt=""><span><b>${esc(s.code)}</b> ${esc(s.colour)} · ${rs(s.from)} ${t('from')}</span></button>`).join('');
    return;
  }
  if (el.id === 'mk') { state.markup = +el.value; document.getElementById('mkLabel').textContent = el.value + '%'; }
  if (el.id === 'pasteBox') { state.pasteText = el.value; }
});
document.addEventListener('keydown', e => {
  if (e.target.id === 'padCode' && e.key === 'Enter') {
    const m = styles.find(s => s.code.startsWith(e.target.value.replace(/\D/g, '')) && e.target.value);
    if (m) addRow(m.id);
  }
  if (e.key === 'Escape' && state.sheet) { state.sheet = null; state.parsed = null; render(); }
});
document.getElementById('notes').innerHTML = notesHTML();
render();
</script>
